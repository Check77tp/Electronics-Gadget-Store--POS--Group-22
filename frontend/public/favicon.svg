<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#bg)"/>

  <!-- chip body -->
  <rect x="11" y="11" width="10" height="10" rx="1.6" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>

  <!-- pins: top -->
  <line x1="13" y1="8"   x2="13" y2="11" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="16" y1="7.5" x2="16" y2="11" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="19" y1="8"   x2="19" y2="11" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>

  <!-- pins: bottom -->
  <line x1="13" y1="21" x2="13" y2="24"   stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="16" y1="21" x2="16" y2="24.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="19" y1="21" x2="19" y2="24"   stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>

  <!-- pins: left -->
  <line x1="8"   y1="13" x2="11" y2="13" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="7.5" y1="16" x2="11" y2="16" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="8"   y1="19" x2="11" y2="19" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>

  <!-- pins: right -->
  <line x1="21" y1="13" x2="24"   y2="13" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="21" y1="16" x2="24.5" y2="16" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="21" y1="19" x2="24"   y2="19" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>

  <!-- power indicator -->
  <circle cx="16" cy="16" r="1.6" fill="#34D399"/>
</svg>
